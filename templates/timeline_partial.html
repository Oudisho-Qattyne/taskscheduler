{% for item in items %}
<div class="flex gap-4 items-start">
    <div class="flex flex-col items-center">
        <div class="w-3 h-3 rounded-full {% if item.type == 'flow' %}bg-blue-500{% else %}bg-purple-500{% endif %}"></div>
        <div class="w-0.5 h-full bg-gray-200 dark:bg-gray-700"></div>
    </div>
    <div class="pb-6">
        <div class="flex items-center gap-2">
            <span class="text-xs font-medium px-2 py-0.5 rounded {% if item.type == 'flow' %}bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200{% else %}bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200{% endif %}">{{ item.type|title }}</span>
            <span class="text-sm font-medium text-gray-900 dark:text-white">{{ item.obj.name }}</span>
        </div>
        <div class="text-sm text-gray-500 dark:text-gray-400 mt-1 countdown" data-time="{{ item.time.isoformat() }}">
            {{ item.time.strftime('%Y-%m-%d %H:%M:%S') }}
        </div>
    </div>
</div>
{% endfor %}
{% if not items %}
<div class="text-center text-gray-400 py-8">No upcoming executions</div>
{% endif %}
<script>
document.querySelectorAll('.countdown').forEach(el => {
    const target = new Date(el.dataset.time);
    function update() {
        const diff = target - new Date();
        if (diff <= 0) { el.textContent = 'Running now...'; return; }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `In ${h}h ${m}m ${s}s`;
    }
    update();
    setInterval(update, 1000);
});
</script>
