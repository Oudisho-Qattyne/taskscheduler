{% extends "base.html" %}
{% block title %}Login - Task Scheduler{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-body">Task Scheduler</h1>
            <p class="text-muted mt-2">Sign in to manage your tasks</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" required autofocus class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" required class="form-input">
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>
        <p class="text-center text-sm text-light mt-4">Default: admin / admin123</p>
    </div>
</div>
{% endblock %}
